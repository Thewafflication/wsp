name: Documentation PDF

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            tools/requirements-dev.txt
            tools/pdf/requirements.txt

      - name: Install development and PDF verification dependencies
        shell: pwsh
        run: python -m pip install --requirement tools/requirements-dev.txt

      - name: Install Pandoc and MiKTeX
        shell: pwsh
        run: |
          function Install-ChocolateyPackage {
            param([Parameter(Mandatory)][string]$Name)

            $attempts = 3
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              choco install $Name --yes --no-progress
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -eq $attempts) {
                throw "Chocolatey failed to install $Name after $attempts attempts."
              }
              Write-Warning (
                "Chocolatey failed to install $Name (attempt " +
                "$attempt of $attempts); retrying in 15 seconds.")
              Start-Sleep -Seconds 15
            }
          }

          Install-ChocolateyPackage pandoc
          Install-ChocolateyPackage miktex
          $machinePath = [Environment]::GetEnvironmentVariable(
            'Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable(
            'Path', 'User')
          $env:Path = "$machinePath;$userPath"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append
          Get-Command pandoc, initexmf, pdflatex -ErrorAction Stop
          initexmf --admin --set-config-value=[MPM]AutoInstall=1
          if ($LASTEXITCODE -ne 0) {
            throw "initexmf configuration failed with exit code $LASTEXITCODE."
          }

      - name: Run repository lint
        shell: pwsh
        run: |
          pre-commit validate-config .pre-commit-config.yaml templates/pre-commit-config.yaml
          if ($LASTEXITCODE -ne 0) {
            throw 'Invalid pre-commit configuration.'
          }
          ./tools/Test-RepositorySyntax.ps1

      - name: Build PDF
        id: build_pdf
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = if ($env:RELEASE_VERSION) {
            $env:RELEASE_VERSION
          } else {
            $description = & git describe --tags --always --dirty
            if ($LASTEXITCODE -ne 0 -or -not $description) {
              throw 'Unable to determine the documentation version.'
            }
            "$description".Trim()
          }
          ./tools/Build-Documentation.ps1 -Version $version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 -Append

      - name: Run full test suite
        shell: pwsh
        run: ./tools/tests/run-all-tests.ps1

      - name: Verify PDF
        shell: pwsh
        run: |
          ./tools/Test-DocumentationPdf.ps1 `
            -ExpectedVersion '${{ steps.build_pdf.outputs.version }}' `
            -ExpectedSourceRevision '${{ github.sha }}' `
            -OutputPath output/pdf/documentation-verification.json

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          ./tools/New-ArtifactChecksum.ps1 `
            -Path output/pdf/wsp-documentation.pdf `
            -OutputPath output/pdf/SHA256SUMS
          $pdf = 'output/pdf/wsp-documentation.pdf'
          $expected = (Get-FileHash -LiteralPath $pdf `
              -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-Content output/pdf/SHA256SUMS -Raw).Trim()
          if ($actual -ne "$expected  wsp-documentation.pdf") {
            throw 'Generated SHA256SUMS entry did not match the PDF.'
          }

      - name: Attest PDF build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: output/pdf/wsp-documentation.pdf

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wsp-documentation
          path: |
            output/pdf/wsp-documentation.pdf
            output/pdf/SHA256SUMS
            output/pdf/documentation-verification.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release PDF
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: wsp-documentation
          path: release-assets

      - name: Create release and upload PDF
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/wsp-documentation.pdf \
              release-assets/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/wsp-documentation.pdf \
              release-assets/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "WSP $RELEASE_TAG" \
              --generate-notes
          fi
