# Copy into the adopting repository as .pre-commit-config.yaml.
# Replace entries with existing canonical scripts when their names differ.
minimum_pre_commit_version: '3.2.0'
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: true
repos:
  - repo: local
    hooks:
      - id: project-lint
        name: Project lint and WSP rule checks
        entry: pwsh -NoProfile -File tools/lint.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: project-build
        name: Project build
        entry: pwsh -NoProfile -File tools/build.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
      - id: project-tests
        name: Project full test suite
        entry: pwsh -NoProfile -File tests/run-tests.ps1
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
