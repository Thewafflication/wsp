name: Documentation PDF

on:
  push:
    branches:
      - main
      - master
    tags:
      - "*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build documentation
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Pandoc and MiKTeX
        shell: pwsh
        run: |
          function Install-ChocolateyPackage {
            param([Parameter(Mandatory)][string]$Name)

            $attempts = 3
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              choco install $Name --yes --no-progress
              if ($LASTEXITCODE -eq 0) {
                return
              }
              if ($attempt -eq $attempts) {
                throw "Chocolatey failed to install $Name after $attempts attempts."
              }
              Write-Warning (
                "Chocolatey failed to install $Name (attempt " +
                "$attempt of $attempts); retrying in 15 seconds.")
              Start-Sleep -Seconds 15
            }
          }

          Install-ChocolateyPackage pandoc
          Install-ChocolateyPackage miktex
          $machinePath = [Environment]::GetEnvironmentVariable(
            'Path', 'Machine')
          $userPath = [Environment]::GetEnvironmentVariable(
            'Path', 'User')
          $env:Path = "$machinePath;$userPath"
          "PATH=$env:Path" | Out-File -FilePath $env:GITHUB_ENV `
            -Encoding utf8 -Append
          Get-Command pandoc, initexmf, pdflatex -ErrorAction Stop
          initexmf --admin --set-config-value=[MPM]AutoInstall=1
          if ($LASTEXITCODE -ne 0) {
            throw "initexmf configuration failed with exit code $LASTEXITCODE."
          }

      - name: Run common-tool tests
        shell: pwsh
        run: ./tools/tests/run-tests.ps1

      - name: Build PDF
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          $version = if ($env:RELEASE_VERSION) {
            $env:RELEASE_VERSION
          } else { $null }
          ./tools/Build-Documentation.ps1 -Version $version

      - name: Verify PDF
        shell: pwsh
        run: |
          $pdf = 'output/pdf/wsp-documentation.pdf'
          if (-not (Test-Path -LiteralPath $pdf -PathType Leaf)) {
            throw "Documentation PDF was not created: $pdf"
          }
          if ((Get-Item -LiteralPath $pdf).Length -eq 0) {
            throw "Documentation PDF is empty: $pdf"
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          ./tools/New-ArtifactChecksum.ps1 `
            -Path output/pdf/wsp-documentation.pdf `
            -OutputPath output/pdf/SHA256SUMS
          $pdf = 'output/pdf/wsp-documentation.pdf'
          $expected = (Get-FileHash -LiteralPath $pdf `
              -Algorithm SHA256).Hash.ToLowerInvariant()
          $actual = (Get-Content output/pdf/SHA256SUMS -Raw).Trim()
          if ($actual -ne "$expected  wsp-documentation.pdf") {
            throw 'Generated SHA256SUMS entry did not match the PDF.'
          }

      - name: Attest PDF build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          subject-path: output/pdf/wsp-documentation.pdf

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: wsp-documentation
          path: |
            output/pdf/wsp-documentation.pdf
            output/pdf/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release PDF
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v8
        with:
          name: wsp-documentation
          path: release-assets

      - name: Create release and upload PDF
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              release-assets/wsp-documentation.pdf \
              release-assets/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              release-assets/wsp-documentation.pdf \
              release-assets/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "WSP $RELEASE_TAG" \
              --generate-notes
          fi
